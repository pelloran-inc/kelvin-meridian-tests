name: CI

# Every gate is blocking: a failing step fails the run. No step may use continue-on-error. The same gates run without
# GitHub Actions: `bash ci/gates.sh`.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: compile · keys · the repository's check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.10 (the oldest the tests support)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Every Python file compiles
        run: python3 -m compileall -q -x "(/data/|/\.git/)" .

      - name: Every test names its memories
        run: python3 tests/keys_needed.py > /dev/null

      - name: The repository's check (tests, pins, links, the README's numbers in their run records, sizes)
        run: python3 ci/check_repo.py

  secret-scan:
    name: secret-scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
